env: "gymma"

env_args:
  key: null
  time_limit: 100
  state_repre_flag: "onehot"  # new
  pretrained_wrapper: null
  reward_list:
    goal: 100
    collision: -10
    wait: -10
    move: -1
  allow_delay: False
  delay_prob: 0.0
  max_delay: 0
  delay_fixed: null
  delay_seed: null

test_greedy: True
test_nepisode: 100
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 2050000

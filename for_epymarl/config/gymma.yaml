env: "gymma"

env_args:
  save_collision_episodes: False # Trueなら衝突したエピソードの全ステップをMyFiles/collision_logs/へ保存。
  key: null
  time_limit: 100
  state_repre_flag: "onehot"  # new
  pretrained_wrapper: null

test_greedy: True
test_nepisode: 100
test_interval: 50000
log_interval: 50000
runner_log_interval: 10000
learner_log_interval: 10000
t_max: 2050000
